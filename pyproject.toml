[project]
name = "biblioteca-digital-astronomia"
version = "0.1.0"
description = "Digital library of astronomy resources (Omeka S + ETL)"
readme = "README.md"
authors = [
    { name = "Gom01", email = "flgomez@bluewin.ch" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "ruff>=0.17.5",
    "types-requests>=2.33.0.20261030",
]
